openapi: 3.1.0
info:
  title: Statistics API
  version: 0.2.4
  description: Dashboard statistics plugin for Medusa v2 with daily aggregation and customizable widgets
servers:
  - url: http://localhost:9000
    description: Local development
paths:
  /admin/statistics:
    get:
      operationId: getAdminStatistics
      summary: List Statistics
      tags:
        - Admin
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum:
              - today
              - week
              - month
            default: week
        - name: start_date
          in: query
          required: false
          schema:
            type: string
        - name: end_date
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statistic:
                    type: object
                    properties:
                      id:
                        type: string
                      date:
                        type: string
                      revenue_total:
                        type: string
                      order_count:
                        type: integer
                      average_order_value:
                        type: string
                      new_customer_count:
                        type: integer
                      returning_customer_count:
                        type: integer
                      pending_fulfillment_count:
                        type: integer
                      low_stock_count:
                        type: integer
                      top_products:
                        type: string
                      metadata:
                        type: object
                        additionalProperties: true
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                      deleted_at:
                        type: string
                        format: date-time
  /admin/statistics/recent-orders:
    get:
      operationId: getAdminStatisticsRecent-orders
      summary: List Recent Orders
      tags:
        - Admin
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: string
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recent-order:
                    type: object
                    properties:
                      id:
                        type: string
                      display_id:
                        type: string
                      status:
                        type: string
                      email:
                        type: string
                      total:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      customer_id:
                        type: string
                      customer:
                        type: object
                        properties:
                          id:
                            type: string
                          first_name:
                            type: string
                          last_name:
                            type: string
  /admin/statistics/low-stock:
    get:
      operationId: getAdminStatisticsLow-stock
      summary: List Low Stock
      tags:
        - Admin
      parameters:
        - name: threshold
          in: query
          required: false
          schema:
            type: string
            default: 10
        - name: limit
          in: query
          required: false
          schema:
            type: string
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
  /admin/statistics/layout:
    post:
      operationId: postAdminStatisticsLayout
      summary: Layout Statistic
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                layout:
                  type: array
                  items:
                    type: string
                x:
                  type: number
                y:
                  type: number
                w:
                  type: number
                h:
                  type: number
                visible:
                  type: boolean
                  default: true
              required:
                - layout
                - x
                - y
                - w
                - h
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
