openapi: 3.1.0
info:
  title: Mcp API
  version: 0.3.0
  description: MCP server and LLM chat plugin for Medusa v2
servers:
  - url: http://localhost:9000
    description: Local development
paths:
  /admin/chat:
    post:
      operationId: postAdminChat
      summary: Create Chat
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                text:
                  type: string
                  minLength: 1
              required:
                - text
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
