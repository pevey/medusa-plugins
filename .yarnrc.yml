nodeLinker: node-modules
nmMode: hardlinks-global
# npmMinimalAgeGate: 1440
enableScripts: false

# Publish to the real npm registry, not the read-only registry.yarnpkg.com mirror
# (which is Yarn's default and rejects publishes). Auth is read from the NPM_TOKEN
# environment variable so no credential is ever stored in this file:
#   NPM_TOKEN=<token> yarn workspace <pkg> npm publish
npmPublishRegistry: 'https://registry.npmjs.org'

npmRegistries:
   'https://registry.npmjs.org':
      npmAlwaysAuth: true
      npmAuthToken: '${NPM_TOKEN:-}'
